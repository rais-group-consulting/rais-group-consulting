<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Under Maintenance | Rais Group Consulting</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#101d2e;
    --navy-2:#16283f;
    --gold:#c2a25a;
    --text:#eef2f7;
    --muted:#a3b1c4;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:
      radial-gradient(1200px 600px at 50% -10%, rgba(194,162,90,.10), transparent 60%),
      linear-gradient(160deg, var(--navy) 0%, var(--navy-2) 100%);
    color:var(--text);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;padding:32px 20px;text-align:center;
    -webkit-font-smoothing:antialiased;
  }
  .card{max-width:620px;width:100%}
  .rule{width:56px;height:2px;background:var(--gold);margin:0 auto 28px}
  .brand{
    font-family:'Playfair Display',Georgia,serif;
    font-size:clamp(22px,4vw,30px);
    letter-spacing:.14em;text-transform:uppercase;
    color:var(--text);margin-bottom:6px;
  }
  .brand span{color:var(--gold)}
  .sub{
    font-size:12px;letter-spacing:.32em;text-transform:uppercase;
    color:var(--muted);margin-bottom:44px;
  }
  h1{
    font-family:'Playfair Display',Georgia,serif;
    font-size:clamp(30px,6vw,46px);
    font-weight:600;line-height:1.15;margin-bottom:20px;
  }
  p.lead{
    color:var(--muted);font-size:16px;line-height:1.8;font-weight:300;
    max-width:480px;margin:0 auto 38px;
  }
  .contact{
    display:inline-block;border:1px solid rgba(194,162,90,.45);
    border-radius:2px;padding:16px 30px;font-size:14px;letter-spacing:.06em;
    color:var(--text);text-decoration:none;transition:.25s ease;
  }
  .contact:hover{background:rgba(194,162,90,.10);border-color:var(--gold)}
  .contact small{display:block;color:var(--muted);letter-spacing:.22em;text-transform:uppercase;font-size:10px;margin-bottom:7px}
  .foot{margin-top:48px;font-size:12px;color:var(--muted);opacity:.75}
  .footer-rule{width:100%;height:1px;background:rgba(255,255,255,.08);margin:34px 0 18px}
</style>
</head>
<body>
  <main class="card">
    <div class="rule"></div>
    <div class="brand">Rais <span>Group</span></div>
    <div class="sub">Consulting</div>

    <h1>Under Maintenance</h1>
    <p class="lead">
      Our website is currently undergoing scheduled maintenance.
      We are working to bring it back online shortly.
      Thank you for your patience.
    </p>

    <a class="contact" href="mailto:philippa@rais-group-consulting.au">
      <small>For enquiries</small>
      philippa@rais-group-consulting.au
    </a>

    <div class="footer-rule"></div>
    <div class="foot">&copy; <span id="yr"></span> Rais Group Consulting. All rights reserved.</div>
  </main>
  <script>document.getElementById('yr').textContent=new Date().getFullYear();</script>
</body>
</html>
